syntax = "proto3";

package cityhawk.common.v1;

option go_package = "cityhawk/backend/pkg/pb/common/v1;commonv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
}

message UserContext {
  string user_id = 1;
  UserRole role = 2;
  bool authenticated = 3;
}

message PageRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message PageResponse {
  int32 total = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message IDRequest {
  string id = 1;
}

message BoolResponse {
  bool ok = 1;
}
