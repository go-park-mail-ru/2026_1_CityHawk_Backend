syntax = "proto3";

package cityhawk.auth.v1;

import "cityhawk/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cityhawk/backend/pkg/pb/auth/v1;authv1";

enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_GOOGLE = 1;
  OAUTH_PROVIDER_YANDEX = 2;
  OAUTH_PROVIDER_VK = 3;
}

service AuthService {
  rpc Register(RegisterRequest) returns (SessionResponse) {}
  rpc Login(LoginRequest) returns (SessionResponse) {}
  rpc OAuthLogin(OAuthLoginRequest) returns (SessionResponse) {}
  rpc Refresh(RefreshRequest) returns (SessionResponse) {}
  rpc Logout(LogoutRequest) returns (cityhawk.common.v1.BoolResponse) {}
  rpc ValidateAccessToken(ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse) {}
  rpc GetMe(GetMeRequest) returns (UserProfile) {}
  rpc UpdateMe(UpdateMeRequest) returns (UserProfile) {}
  rpc GetUser(GetUserRequest) returns (UserProfile) {}
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  string csrf_token = 3;
  google.protobuf.Timestamp access_expires_at = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
}

message UserProfile {
  string id = 1;
  string email = 2;
  string username = 3;
  string user_surname = 4;
  cityhawk.common.v1.UserRole role = 5;
  optional string birthday = 6;
  optional string avatar_url = 7;
  optional cityhawk.common.v1.City city = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string user_surname = 3;
  string password = 4;
  optional string birthday = 5;
  optional string city_id = 6;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message OAuthLoginRequest {
  OAuthProvider provider = 1;
  string code = 2;
  string redirect_uri = 3;
  optional string state = 4;
}

message RefreshRequest {
  string refresh_token = 1;
  string csrf_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message SessionResponse {
  UserProfile user = 1;
  TokenPair tokens = 2;
}

message ValidateAccessTokenRequest {
  string access_token = 1;
}

message ValidateAccessTokenResponse {
  bool valid = 1;
  cityhawk.common.v1.UserContext context = 2;
}

message GetMeRequest {
  cityhawk.common.v1.UserContext context = 1;
}

message UpdateMeRequest {
  cityhawk.common.v1.UserContext context = 1;
  optional string email = 2;
  optional string username = 3;
  optional string user_surname = 4;
  optional string birthday = 5;
  optional string city_id = 6;
  optional string avatar_url = 7;
  bool clear_birthday = 8;
  bool clear_city_id = 9;
  bool clear_avatar_url = 10;
}

message GetUserRequest {
  string user_id = 1;
  optional cityhawk.common.v1.UserContext viewer_context = 2;
}

