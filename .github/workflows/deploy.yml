name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - api_rk4
  workflow_dispatch:

concurrency:
  group: backend-ci
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"

jobs:
  validate:
    name: Test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated easyjson files
        run: |
          make generate
          git diff --exit-code -- internal/*/delivery/http/*_easyjson.go

      - name: Run tests
        run: make test

      - name: Check coverage
        run: make coverage-check

      - name: Validate docker compose
        run: |
          touch .env
          docker compose config >/dev/null
