name: Deploy backend

on:
  push:
    branches:
      - main
      - master
      - dev
      - api_rk4
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/cityhawk/backend' }}

jobs:
  validate:
    name: Test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated easyjson files
        run: |
          make generate
          git diff --exit-code -- internal/*/delivery/http/*_easyjson.go

      - name: Run tests
        run: make test

      - name: Check coverage
        run: make coverage-check

      - name: Validate docker compose
        run: docker compose config >/dev/null

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Create release directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}'"

      - name: Upload backend sources
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cache' \
            --exclude '.bin' \
            --exclude 'coverage.out' \
            --exclude 'coverage.raw.out' \
            --exclude 'uploads' \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT}" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"

      - name: Write production env file
        run: |
          if [ -n "${PROD_ENV}" ]; then
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cat > '${DEPLOY_PATH}/.env'" <<'EOF'
          ${{ secrets.PROD_ENV }}
          EOF
          else
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "touch '${DEPLOY_PATH}/.env'"
          fi
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}

      - name: Start containers
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' && docker compose up -d --build --remove-orphans"

      - name: Check backend health
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${DEPLOY_PATH}' && docker compose ps && curl -fsS http://localhost:8080/api/health"
